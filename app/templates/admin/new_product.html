{% extends 'base.html' %}

{% block title %}Nuevo Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="card-title mb-0 fs-5 fw-bold">Agregar Nuevo Producto</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.new_product') }}">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Insumo</label>
                        <input type="text" name="name" class="form-control" required placeholder="Ej: Amoxicilina 500mg, Barbijo Tricapa...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <select name="category_id" class="form-select" required>
                            <option value="">-- Seleccionar Categoría --</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock Inicial</label>
                            <input type="number" name="current_stock" class="form-control" value="0" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock Mínimo (Alerta)</label>
                            <input type="number" name="min_stock" class="form-control" value="5" min="0" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a href="{{ url_for('products.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar y Notificar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
